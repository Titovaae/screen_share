services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: screen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screen"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # образ из Docker Hub; подставьте свой логин в переменную DOCKERHUB_USERNAME
    image: ${DOCKERHUB_USERNAME:-yourname}/screen-server:latest
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/screen
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_USER: admin
      APP_PASSWORD: admin
      # Чтобы снимать реальный экран хоста (Linux/X11), раскомментируйте:
      # DISPLAY: ":0"
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
    #   - ./logs:/app/logs

volumes:
  pgdata:
