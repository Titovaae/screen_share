server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/screen}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# таблица app_user создаётся Hibernate автоматически
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# пользователь, создаваемый при первом запуске, если таблица пуста
app.default-user.login=${APP_USER:admin}
app.default-user.password=${APP_PASSWORD:admin}

# каталог лога вызовов контроллеров
app.log.dir=${LOG_DIR:logs}
